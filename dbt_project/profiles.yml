nyc_taxi_profile:
  target: "{{ env_var('ENVIRONMENT', 'LOCAL') | lower }}"
  outputs:
    local:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      user: "{{ env_var('POSTGRES_USER', 'db_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'db_password') }}"
      port: 5432
      dbname: "{{ env_var('POSTGRES_DB', 'silver_db') }}"
      schema: gold
      threads: 4

    gcp:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: gold
      location: asia-southeast1  # ⚠️ Sesuaikan dengan region dataset BigQuery Anda (misal: US atau us-central1)
      keyfile: /opt/airflow/config/gcp_key.json
      threads: 4
      timeout_seconds: 300
      priority: interactive